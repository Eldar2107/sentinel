version: "3.9"

services:
  # ─── Bank Simulyatorları ───────────────────────────────────────────────────
  bank-a:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    container_name: sentinel-bank-a
    environment:
      BANK_ID: "bank_a"
      BANK_NAME: "TBC Bank (Compliant)"
      LATENCY_MS: "120"
      ERROR_RATE: "0.01"
      DATE_FORMAT: "iso8601"
      SCHEMA_STRICT: "true"
    ports:
      - "8001:8000"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  bank-b:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    container_name: sentinel-bank-b
    environment:
      BANK_ID: "bank_b"
      BANK_NAME: "Bank of Georgia (Drift)"
      LATENCY_MS: "320"
      ERROR_RATE: "0.05"
      DATE_FORMAT: "slash"
      SCHEMA_STRICT: "false"
      EXTRA_FIELDS: "true"
    ports:
      - "8002:8000"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  bank-c:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    container_name: sentinel-bank-c
    environment:
      BANK_ID: "bank_c"
      BANK_NAME: "Liberty Bank (Unstable)"
      LATENCY_MS: "750"
      ERROR_RATE: "0.20"
      DATE_FORMAT: "unix"
      SCHEMA_STRICT: "false"
      REQUIRE_CUSTOM_HEADER: "true"
      FLAKY: "true"
    ports:
      - "8003:8000"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL Verilənlər Bazası ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/core/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (keş və pub/sub) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Əsas Backend API ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: sentinel-backend
    environment:
      DATABASE_URL: "postgresql://sentinel:sentinel_secret@postgres:5432/sentinel"
      REDIS_URL: "redis://redis:6379"
      BANK_A_URL: "http://bank-a:8000"
      BANK_B_URL: "http://bank-b:8000"
      BANK_C_URL: "http://bank-c:8000"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bank-a:
        condition: service_healthy
      bank-b:
        condition: service_healthy
      bank-c:
        condition: service_healthy
    networks:
      - sentinel-net
    volumes:
      - ./data:/app/data

  # ─── AI Mühərriki ─────────────────────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai
      dockerfile: Dockerfile.ai
    container_name: sentinel-ai
    environment:
      DATABASE_URL: "postgresql://sentinel:sentinel_secret@postgres:5432/sentinel"
      REDIS_URL: "redis://redis:6379"
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-net

  # ─── Frontend Dashboard ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: sentinel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres_data:
